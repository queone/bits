<div id="all-filter" class="text-small"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var box = document.querySelector('input[name="q"]');
  var count = document.getElementById('all-filter');
  var list = document.querySelector('#all-filter ~ ul');
  if (!box || !count || !list) return;
  var items = Array.prototype.slice.call(list.children);
  function apply() {
    var words = box.value.toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
    items.forEach(function (li) {
      var text = li.textContent.toLowerCase();
      var hit = words.every(function (w) { return text.indexOf(w) !== -1; });
      li.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    count.textContent = words.length ? shown + ' of ' + items.length : '';
  }
  box.addEventListener('input', apply);
  box.form.addEventListener('submit', function (e) { e.preventDefault(); apply(); });
  var q = new URLSearchParams(location.search).get('q');
  if (q) { box.value = q; }
  apply();
});
</script>
